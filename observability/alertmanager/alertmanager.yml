global:
  resolve_timeout: 5m

route:
  receiver: "webhook-principal"
  group_by: ["alertname", "service", "category"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "webhook-principal"
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 20

templates:
  - /etc/alertmanager/templates/*.tmpl
