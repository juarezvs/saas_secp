name: secp-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: secp-observability-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.config.file=/etc/prometheus/web.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-40GB}"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_BIND_PORT:-9090}:9090"
    secrets:
      - secp_metrics_token
    networks:
      - observability
      - secp_app
    depends_on:
      - alertmanager
      - blackbox_exporter
      - node_exporter
      - cadvisor
      - postgres_exporter
      - redis_exporter
      - tempo
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: secp-observability-grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_BIND_PORT:-3100}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3100/}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Manaus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "0.75"
    logging: *default_logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: secp-observability-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alertmanager_webhook_url
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    logging: *default_logging

  tempo:
    image: grafana/tempo:2.6.1
    container_name: secp-observability-tempo
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - observability
      - secp_app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "0.75"
    logging: *default_logging

  loki:
    image: grafana/loki:3.3.2
    container_name: secp-observability-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "0.75"
    logging: *default_logging

  promtail:
    image: grafana/promtail:3.3.2
    container_name: secp-observability-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.25"
    logging: *default_logging

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: secp-observability-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.25"
    logging: *default_logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: secp-observability-cadvisor
    restart: unless-stopped
    privileged: false
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: "0.5"
    logging: *default_logging

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: secp-observability-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME_FILE: /run/secrets/postgres_exporter_dsn
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "true"
    secrets:
      - postgres_exporter_dsn
    networks:
      - observability
      - secp_app
    depends_on:
      - redis_exporter
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.25"
    logging: *default_logging

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: secp-observability-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://secp-redis:6379
    networks:
      - observability
      - secp_app
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.25"
    logging: *default_logging

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: secp-observability-blackbox-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.25"
    logging: *default_logging

secrets:
  secp_metrics_token:
    file: ${SECP_METRICS_TOKEN_FILE:-./secrets/secp_metrics_token}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password}
  postgres_exporter_dsn:
    file: ${POSTGRES_EXPORTER_DSN_FILE:-./secrets/postgres_exporter_dsn}
  alertmanager_webhook_url:
    file: ${ALERTMANAGER_WEBHOOK_URL_FILE:-./secrets/alertmanager_webhook_url}

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/observability/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/observability/grafana
  alertmanager_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/observability/alertmanager
  tempo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/observability/tempo
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/observability/loki

networks:
  observability:
    name: secp-observability-network
    driver: bridge
  secp_app:
    name: ${SECP_DOCKER_NETWORK:-secp-prod_secp-network}
    external: true
