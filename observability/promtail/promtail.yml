server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          host: secp
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - json:
          expressions:
            level: level
            service: service
            route: route
            traceId: traceId
            requestId: requestId
          source: output
      - labels:
          level:
          service:
          route:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
