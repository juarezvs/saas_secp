groups:
  - name: secp_database
    rules:
      - alert: SecpPostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
          service: postgres
          category: database
        annotations:
          summary: "PostgreSQL indisponivel para exporter"
          description: "O postgres_exporter nao consegue consultar o banco do SECP."
          runbook_url: "docs/runbooks/postgres.md"
      - alert: SecpRedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          service: redis
          category: database
        annotations:
          summary: "Redis indisponivel para exporter"
          description: "O redis_exporter nao consegue consultar o Redis do SECP."
          runbook_url: "docs/runbooks/redis.md"
      - alert: SecpPostgresTooManyConnections
        expr: sum(pg_stat_activity_count) / sum(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgres
          category: database
        annotations:
          summary: "PostgreSQL com muitas conexoes"
          description: "O uso de conexoes do PostgreSQL passou de 80%."
          runbook_url: "docs/runbooks/postgres.md"

