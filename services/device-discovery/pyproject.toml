[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secp-device-discovery"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "redis>=5,<8", "psycopg[binary]>=3.2,<4", "psutil>=6,<8",
  "defusedxml>=0.7,<1", "dnslib>=0.9,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
secp-device-discovery = "discovery.central:main"
secp-discovery-agent = "discovery.agent:main"
secp-discovery-worker = "discovery.worker:main"

[tool.setuptools.packages.find]
include = ["discovery*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI resolve Depends por requisição.
